name: Deploy demo to GitHub Pages

# Publishes the STATIC PREVIEW target only.
#
# What works on Pages: the landing page, the full /demo flow (simulated
# players), and prerendered room pages for the DEMO and PARTY codes.
#
# What does NOT work on Pages, by design:
#   · on-demand unfurl cards for arbitrary room codes (needs a server)
#   · live WebSocket rooms (those run on the Cloudflare Worker)
# The production app belongs on Vercel (or Cloudflare via OpenNext).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; don't cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        env:
          PAGES_BUILD: "1"
          # Project Pages are served from /<repo>
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
